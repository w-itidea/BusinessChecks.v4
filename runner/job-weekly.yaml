# Cloud Run Job: WTORKOWA analiza strat -> Slack, do Wojtka i Artura.
#
# Po co osobno od businesschecks-daily (decyzja Wojtka 2026-09-12):
# „analiza strat ktore teraz wysylasz codziennie teraz chcemy 1 raz w tygodniu (...)
#  ma 8 dni do tylu — do mnie i do Artura". Dzien przesuniety na WTOREK (2026-09-14).
# Adresat jest inny niz w raporcie dziennym, a --send dziala na caly przebieg, nie na
# pojedynczy check — wiec innego adresata nie da sie uzyskac inaczej niz osobnym jobem.
#
# 🔴 OKNO 8 DNI, NIE 7 — celowo. Przy dokladnie tygodniu kazde przesuniecie albo nieudany
# przebieg robi dziure w pokryciu, ktorej nikt nie zobaczy. Jeden dzien zakladki znaczy,
# ze cos najwyzej pojawi sie dwa razy, zamiast zniknac.
#
# ⚠️ Guardy dnia tygodnia USUNIETE z tych checkow. Rytm siedzi teraz w harmonogramie,
# w jednym miejscu. Gdyby zostal takze w SQL, reczne powtorzenie nieudanego przebiegu nazajutrz
# zwrociloby PUSTO — czyli falszywe „nie ma strat" zamiast raportu.
#
# Deploy:
#   gcloud run jobs replace runner/job-weekly.yaml --region=europe-north1 --project=erp-production-438714
#
# ⚠️ NOWY JOB NIE DZIEDZICZY prawa do odpalania. businesschecks@ ma run.invoker na
# businesschecks-daily, ale nadanie jest PER JOB — bez ponizszego trigger wraca z kodem 7
# (PERMISSION_DENIED) i we wtorek nic nie przychodzi, cicho:
#   gcloud run jobs add-iam-policy-binding businesschecks-weekly \
#     --region=europe-north1 --project=erp-production-438714 \
#     --member=serviceAccount:businesschecks@erp-production-438714.iam.gserviceaccount.com \
#     --role=roles/run.invoker
#
# Trigger (wtorek 8:05 czasu warszawskiego, dwie minuty po raporcie dziennym):
#   gcloud scheduler jobs create http businesschecks-weekly-trigger \
#     --location=europe-central2 --project=erp-production-438714 \
#     --schedule="5 8 * * 2" --time-zone="Europe/Warsaw" \
#     --uri="https://europe-north1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/erp-production-438714/jobs/businesschecks-weekly:run" \
#     --http-method=POST \
#     --oauth-service-account-email=businesschecks@erp-production-438714.iam.gserviceaccount.com
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: businesschecks-weekly
  labels:
    cloud.googleapis.com/location: europe-north1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: businesschecks@erp-production-438714.iam.gserviceaccount.com
          timeoutSeconds: 900
          maxRetries: 1
          containers:
            - name: checks
              image: europe-north1-docker.pkg.dev/erp-production-438714/cloud-run-source-deploy/businesschecks/etl:latest
              args:
                - -m
                - runner.run_check
                - --tytul=Straty — raport tygodniowy (8 dni)
                - --check=stratne-daily
                - --check=stratne-wg-planu
                - --check=stratne-przyczyny
                - --check=stratne-wzorce
                - --check=stratne-zastepcze
                # stratne-kierunki zostaje na oknie 90 dni — ponizej 20 zamowien jeden pech
                # wyglada jak trend, wiec 8 dni nic by tu nie powiedzialo.
                - --check=stratne-kierunki
                - --send=U03787T2DTR          # DM Wojtka
                - --send=U03A1N2JASD          # DM Artura
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
              env:
                - name: MAX_SCAN_GB
                  value: "20"
