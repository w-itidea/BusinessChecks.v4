# Cloud Run Job: delta sync BIData/azymut -> BigQuery (dataset BIData @ europe-west3).
#
# Wzorzec skopiowany z ItIdea.Supplier.Bots/deploy/jobs/dedalus.yaml — sidecar cloudflared
# daje dostep do SQL Server spoza VPN, wiec job nie potrzebuje wlaczonego laptopa.
#
# Deploy:
#   gcloud run jobs replace etl/job.yaml --region=europe-north1 --project=erp-production-438714
#
# Harmonogram co 8h (00:10, 08:10, 16:10 czasu warszawskiego) — ZALOZONY.
# UWAGA: Cloud Scheduler NIE obsluguje europe-north1 (job tam stoi, ale trigger musi byc gdzie indziej).
# Uzyta lokalizacja: europe-central2 (Warszawa).
#   gcloud scheduler jobs create http bidata-bq-sync-trigger \
#     --location=europe-central2 --project=erp-production-438714 \
#     --schedule="10 */8 * * *" --time-zone="Europe/Warsaw" \
#     --uri="https://europe-north1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/erp-production-438714/jobs/bidata-bq-sync:run" \
#     --http-method=POST \
#     --oauth-service-account-email=supplier-bots@erp-production-438714.iam.gserviceaccount.com
#
# WYMAGA (do potwierdzenia przed deployem):
#   * sekret z haslem readonly do SQL Server — nazwa ponizej to propozycja wg konwencji
#     z ~/.claude/SECRETS.md; jesli nie istnieje, trzeba go zalozyc
#   * WLASNE konto serwisowe dla businesschecks (Wojtek zaklada osobno — NIE pozyczamy
#     supplier-bots@, bo to inny cykl zycia i inne uprawnienia). Role dla niego:
#       - roles/secretmanager.secretAccessor   (erp-production-438714: haslo SQL + tokeny tunelu)
#       - roles/bigquery.dataEditor            (polish-bookstores-group — CROSS-PROJECT, latwe do przeoczenia)
#       - roles/bigquery.jobUser               (polish-bookstores-group)
#       - roles/artifactregistry.reader        (erp-production-438714)
#     Po zalozeniu podmien serviceAccountName ponizej.

apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: bidata-bq-sync
  labels:
    cloud.googleapis.com/location: europe-north1
  annotations:
    run.googleapis.com/launch-stage: BETA
    # Cloud Run startuje kontenery ROWNOLEGLE. Bez tej zaleznosci ETL laczy sie do bazy
    # zanim cloudflared postawi tunel i dostaje "Connection refused". Kod dodatkowo czeka
    # (CONNECT_WAIT_S), ale zaleznosc zalatwia to na poziomie platformy.
    run.googleapis.com/container-dependencies: '{"etl":["cloudflared"]}'
spec:
  template:
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          # PLACEHOLDER — podmien na konto zalozone dla businesschecks (patrz naglowek).
          serviceAccountName: businesschecks@erp-production-438714.iam.gserviceaccount.com
          timeoutSeconds: 3600
          maxRetries: 1
          containers:
            # ── ETL ────────────────────────────────────────────────
            - name: etl
              image: europe-north1-docker.pkg.dev/erp-production-438714/cloud-run-source-deploy/businesschecks/etl:latest
              # Co 8h synchronizujemy TYLKO tabele, ktorych uzywaja checki.
              # ofi_PriceOffer ma wlasny, DZIENNY trigger (bidata-bq-sync-priceoffer):
              # to tabela goraca (8,3 z 14,8 mln wierszy zmienia sie na dobe), wiec jej MERGE
              # skanuje ~14,5 GB i odpowiadal za ~75% kosztu calego automatu (26 z 35 zl/mies.).
              # Zaden biezacy check jej nie potrzebuje poza buybox-sale-profitability.
              args:
                - -m
                - etl.sync
                - --table=opi_OrderProfit
                - --table=opi_OrderItemProfit
                - --table=opi_ShippingCost
                - --table=opi_OrderProfitTag
                - --table=azymut_BookstoreProductPA
                - --table=azymut_SupplierPA
                - --table=azymut_CustomerOrder
                - --table=azymut_BookstoreProduct
                - --table=azymut_Dzial
              resources:
                limits:
                  cpu: "2"
                  memory: 4Gi
              env:
                # Ruch do bazy idzie przez sidecar cloudflared na localhoscie
                - name: SQL_HOST
                  value: "127.0.0.1"
                - name: SQL_USER
                  value: "claude_readonly"
                - name: SQL_PASS
                  valueFrom:
                    secretKeyRef:
                      name: db-mssql-azymut-readonly-password
                      key: latest
                # Bezpiecznik kosztowy — MERGE/watermark ponad ten skan przerywa robote.
                # 40, nie 20: ofi_PriceOffer zmienia ~8,5 mln z 15,4 mln wierszy na dobe, a tabela
                # nie jest partycjonowana i klastruje po (BookstoreId, OurEan), podczas gdy MERGE
                # laczy po kluczu Id — nie ma czego przycinac, wiec cel czytany jest w calosci
                # (23,5 GB). Przy 20 GB job padal KAZDEJ nocy, po dwoch probach, za kazdym razem
                # ciagnac ~8 mln wierszy z produkcyjnego SQL Servera i wyrzucajac je do kosza.
                # 23,5 GB to ~0,5 zl za przebieg, ~15 zl/mies — swiadomie tanszy wybor niz
                # zjadanie zapasu czasu w jobie pelnym przeladowaniem (60 min timeout).
                # Bezpiecznik dalej dziala: 40 GB nadal zlapie zapytanie, ktore naprawde zwariowalo.
                - name: MAX_SCAN_GB
                  value: "40"

            # ── tunel do SQL Server (sql.fkwt.pl) ──────────────────
            - name: cloudflared
              image: cloudflare/cloudflared:latest
              args:
                - access
                - tcp
                - --hostname=sql.fkwt.pl
                - --url=127.0.0.1:1433
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: TUNNEL_SERVICE_TOKEN_ID
                  valueFrom:
                    secretKeyRef:
                      name: cred-api-cf-tunnel-fkwt-id
                      key: latest
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cred-api-cf-tunnel-fkwt-secret
                      key: latest
