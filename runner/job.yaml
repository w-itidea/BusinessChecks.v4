# Cloud Run Job: dzienny raport checkow -> Slack DM Wojtka.
# Zastepuje ~/.claude/cron/stratne_slack.sh (headless `claude -p` na laptopie).
#
# BEZ sidecara cloudflared i BEZ sekretu do SQL — checki czytaja wylacznie BigQuery,
# wiec nie potrzebuja ani tunelu, ani bazy. To jest cala korzysc z warstwy mirrora.
#
# Deploy:
#   gcloud run jobs replace runner/job.yaml --region=europe-north1 --project=erp-production-438714
# Trigger (8:03 czasu warszawskiego, jak stary cron):
#   gcloud scheduler jobs create http businesschecks-daily-trigger \
#     --location=europe-central2 --project=erp-production-438714 \
#     --schedule="3 8 * * *" --time-zone="Europe/Warsaw" \
#     --uri="https://europe-north1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/erp-production-438714/jobs/businesschecks-daily:run" \
#     --http-method=POST \
#     --oauth-service-account-email=businesschecks@erp-production-438714.iam.gserviceaccount.com

apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: businesschecks-daily
  labels:
    cloud.googleapis.com/location: europe-north1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: businesschecks@erp-production-438714.iam.gserviceaccount.com
          timeoutSeconds: 900
          maxRetries: 1
          containers:
            - name: checks
              image: europe-north1-docker.pkg.dev/erp-production-438714/cloud-run-source-deploy/businesschecks/etl:latest
              args:
                - -m
                - runner.run_check
                - --tytul=Raport dzienny — duże straty i zdrowie danych
                # ── CODZIENNIE: tylko to, na co trzeba zareagowac TEGO DNIA ──
                # Decyzja Wojtka 2026-09-12: „codziennie masz wysylac tylko b. duze straty".
                # Pelna analiza strat przeniesiona do businesschecks-weekly (poniedzialek, okno 8 dni,
                # do Wojtka i Artura). Tutaj zostaje pojedyncza lista duzych strat plus zdrowie danych —
                # bo o zepsutym mirrorze albo o przestaniu splywac raportow Amazona trzeba wiedziec od razu.
                - --check=stratne-duze
                - --check=mirror-health
                - --check=amazon-raporty-pokrycie
                - --check=amazon-negatywy-cisza
                # ── MIESIECZNIE (1. dnia, guard w SQL) ──
                # Guard zostaje, bo 1. dzien miesiaca rzadko wypada w poniedzialek —
                # przeniesienie tego do joba tygodniowego uciszyloby check na 11 miesiecy w roku.
                - --check=stratne-struktura
                - --send=U03787T2DTR          # DM Wojtka
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
              env:
                - name: MAX_SCAN_GB
                  value: "20"
